<meta charset="utf-8">

<title>👻 파스모포비아 치트시트</title>
<style>
:root{--bg:#090d14;--card:#121927;--line:#263246;--text:#f4f7fb;--muted:#9aa7ba;--purple:#8b5cf6;--red:#ef4444;--green:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(30px + env(safe-area-inset-bottom))}
header{padding:18px 0 12px;position:sticky;top:0;background:#090d14ee;backdrop-filter:blur(14px);z-index:10}
h1{font-size:24px;margin:0 0 5px} .sub{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,.mode{border:0;border-radius:12px;padding:11px 13px;background:#1b2433;color:#fff;font-weight:700;font-size:14px}
button:active{transform:scale(.98)} .reset{background:#991b1b}
.mode.active{background:var(--purple)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.panel h2{font-size:16px;margin:0 0 10px}
.evgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ev{position:relative;min-height:52px;border:1px solid var(--line);border-radius:12px;background:#182131;color:#fff;padding:9px 10px;text-align:left}
.ev b{display:block;font-size:14px} .ev small{color:var(--muted);font-size:11px}
.ev.found{border-color:var(--green);background:#123020} .ev.found b:before{content:"✅ "}
.ev.no{border-color:var(--red);background:#34171b} .ev.no b:before{content:"❌ "}
.info{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px}
.count{font-size:15px;font-weight:800;margin-bottom:10px}
.ghosts{display:grid;gap:9px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.ghost h3{margin:0 0 8px;font-size:17px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;background:#222d40;border-radius:7px;padding:5px 7px;color:#dbe4f2}
.tag.force{outline:1px solid #f59e0b;color:#fbbf24}
.mimic{font-size:12px;color:#fbbf24;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
footer{font-size:11px;color:#66748a;line-height:1.5;margin:16px 2px}
@media(min-width:600px){.evgrid{grid-template-columns:repeat(4,1fr)}}
</style>

 관찰"], "Phantom": ["사진을 찍으면 이벤트 중 모습이 사라지고 사냥 중 덜 보임", "일반 발소리", "깜빡임이 길어 덜 보임", "유령 사진을 찍었는데 사진에 유령이 안 보이는지 확인"], "Poltergeist": ["여러 물건을 한꺼번에 던질 수 있음", "일반 발소리", "물건이 많을수록 강력한 투척", "물건을 한곳에 모아 연속/동시 투척을 확인"], "Raiju": ["전자기기 근처에서 빠르고 전자기기 영향 범위가 큼", "일반 발소리", "전자기기 근처에서 빠른 사냥", "사냥 중 전자기기를 들었다 놓으며 속도 변화 관찰"], "Revenant": ["플레이어를 감지하지 못하면 느리고 감지하면 극도로 빨라짐", "일반 발소리", "감지 순간 속도 급상승", "시야 확보 전후 속도 차이가 매우 큰지 확인"], "Shade": ["플레이어가 가까이 있으면 활동과 사냥이 줄어드는 수줍은 유령", "일반 발소리", "사냥/이벤트 자체가 소극적", "방 안에 사람이 있을 때 활동이 현저히 적은지 확인"], "Spirit": ["특별한 고유 행동은 적지만 향의 사냥 방지 시간이 김", "일반 발소리", "일반적인 사냥 패턴", "향 사용 후 다음 사냥까지 시간을 재기"], "Thaye": ["초반에는 강하고 빠르며 플레이어가 가까이 머물면 늙어감", "일반 발소리", "시간이 지날수록 느려지고 약해짐", "초반 사냥 속도와 오래 머문 뒤의 속도를 비교"], "The Mimic": ["다른 유령의 행동을 흉내냄. 가짜 고스트 오브 가능", "흉내낸 유령의 행동/속도", "복제한 유령에 따라 달라짐", "라디오+지문+영하가 맞는데 고스트 오브까지 보이면 강력한 의심"], "The Twins": ["서로 다른 위치에서 상호작용할 수 있고 사냥 속도 패턴이 두 가지", "발소리는 일반적", "두 가지 속도 느낌이 나타날 수 있음", "멀리 떨어진 동시 상호작용과 속도 차이를 함께 확인"], "Wraith": ["소금을 절대 밟지 않고 플레이어에게 순간이동할 수 있음", "일반 발소리", "사냥 자체는 일반적인 편", "소금은 있는데 발자국 UV가 계속 없는지 확인"], "Yokai": ["말소리와 전자기기에 민감하며 사냥 중 감지 범위가 짧음", "일반 발소리", "가까운 전자기기/대화에 더 민감", "사냥 중 전자기기를 들고도 가까이까지 못 찾는지 확인"], "Yurei": ["문을 강하게 닫는 특수 능력과 정신력 감소 능력", "일반 발소리", "문을 강하게 닫거나 유령방으로 돌아가는 행동", "열린 문이 갑자기 크게 닫히는 행동을 확인"]};

<script>
const DATA=[{"name": "Aswang", "evidence": ["D.O.T.S", "영하의 온도", "고스트 오브"]}, {"name": "Banshee", "evidence": ["D.O.T.S", "고스트 오브", "지문"]}, {"name": "Dayan", "evidence": ["EMF 5", "고스트 오브", "라디오"]}, {"name": "Deildegast", "evidence": ["EMF 5", "고스트 라이팅", "D.O.T.S"]}, {"name": "Demon", "evidence": ["고스트 라이팅", "지문", "영하의 온도"]}, {"name": "Deogen", "evidence": ["D.O.T.S", "고스트 라이팅", "라디오"]}, {"name": "Gallu", "evidence": ["EMF 5", "지문", "라디오"]}, {"name": "Goryo", "evidence": ["D.O.T.S", "EMF 5", "지문"]}, {"name": "Hantu", "evidence": ["고스트 오브", "지문", "영하의 온도"]}, {"name": "Jinn", "evidence": ["EMF 5", "지문", "영하의 온도"]}, {"name": "Kormos", "evidence": ["고스트 오브", "라디오", "지문"]}, {"name": "Mare", "evidence": ["고스트 라이팅", "고스트 오브", "라디오"]}, {"name": "Moroi", "evidence": ["고스트 라이팅", "영하의 온도", "라디오"]}, {"name": "Myling", "evidence": ["고스트 라이팅", "EMF 5", "지문"]}, {"name": "Obake", "evidence": ["EMF 5", "고스트 오브", "지문"]}, {"name": "Obambo", "evidence": ["고스트 라이팅", "지문", "D.O.T.S"]}, {"name": "Oni", "evidence": ["D.O.T.S", "EMF 5", "영하의 온도"]}, {"name": "Onryo", "evidence": ["라디오", "고스트 오브", "영하의 온도"]}, {"name": "Phantom", "evidence": ["라디오", "지문", "D.O.T.S"]}, {"name": "Poltergeist", "evidence": ["고스트 라이팅", "지문", "라디오"]}, {"name": "Raiju", "evidence": ["EMF 5", "고스트 오브", "D.O.T.S"]}, {"name": "Revenant", "evidence": ["고스트 라이팅", "고스트 오브", "영하의 온도"]}, {"name": "Shade", "evidence": ["EMF 5", "고스트 라이팅", "영하의 온도"]}, {"name": "Spirit", "evidence": ["EMF 5", "고스트 라이팅", "라디오"]}, {"name": "Thaye", "evidence": ["고스트 라이팅", "고스트 오브", "D.O.T.S"]}, {"name": "The Mimic", "evidence": ["라디오", "지문", "영하의 온도"]}, {"name": "The Twins", "evidence": ["EMF 5", "영하의 온도", "라디오"]}, {"name": "Wraith", "evidence": ["EMF 5", "라디오", "D.O.T.S"]}, {"name": "Yokai", "evidence": ["라디오", "고스트 오브", "D.O.T.S"]}, {"name": "Yurei", "evidence": ["영하의 온도", "고스트 오브", "D.O.T.S"]}];
const EV=[["EMF 5","EMF 레벨 5"],["라디오","Spirit Box"],["지문","Ultraviolet"],["고스트 오브","Ghost Orb"],["고스트 라이팅","Ghost Writing"],["영하의 온도","Freezing"],["D.O.T.S","D.O.T.S."]];
const forced={"Goryo":"D.O.T.S","Deogen":"라디오","Moroi":"라디오","Hantu":"영하의 온도","Obake":"지문"};
let state=JSON.parse(localStorage.getItem("phasma-v4")||"{}");
let mode=3;

function cycle(e){
  state[e]=((state[e]||0)+1)%3;
  localStorage.setItem("phasma-v4",JSON.stringify(state)); render();
}
function resetAll(){state={};localStorage.removeItem("phasma-v4");render()}
function possible(g){
  const found=EV.map(x=>x[0]).filter(e=>state[e]===1);
  const no=EV.map(x=>x[0]).filter(e=>state[e]===2);
  if(found.some(e=>!g.evidence.includes(e))) return false;
  if(no.some(e=>g.evidence.includes(e))) return false;
  return true;
}
function render(){
  evgrid.innerHTML=EV.map(([e,en])=>{
    const s=state[e]||0;
    return `<button class="ev ${s===1?"found":s===2?"no":""}" onclick="cycle('${e}')"><b>${e}</b><small>${en}</small></button>`;
  }).join("");
  const list=DATA.filter(possible);
  count.textContent=`가능한 유령 ${list.length} / ${DATA.length}`;
  ghosts.innerHTML=list.length?list.map(g=>{
    const tags=g.evidence.map(e=>`<span class="tag ${forced[g.name]===e?"force":""}">${e}${forced[g.name]===e?" 🔒":""}</span>`).join("");
    const extra=g.name==="The Mimic"?`<div class="mimic">🟡 고스트 오브는 가짜 증거일 수 있음</div>`:"";
    return `<article class="ghost"><h3>👻 ${g.name}</h3><div class="tags">${tags}</div>${extra}</article>`;
  }).join(""):`<div class="empty">조건에 맞는 유령이 없습니다.<br>❌ 제외한 증거를 다시 확인해보세요.</div>`;
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=+b.dataset.mode;render();
});
reset.onclick=resetAll; render();
</script>
</body>
</html>
